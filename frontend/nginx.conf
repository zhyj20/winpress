upstream winpress_backend {
  server backend:8092;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;
  include /etc/nginx/conf.d/security-headers.conf;

  location /api/ {
    proxy_pass http://winpress_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Uploaded project material is available only through the authenticated API download endpoint.
  location ^~ /files/ {
    return 404;
  }

  # Test-account material is deliberately excluded from the production frontend image.
  location = /test-accounts.html {
    return 404;
  }

  # The anonymized case view is public for human review but intentionally excluded from
  # search indexing. The original client files are never copied into the frontend image.
  location = /cases/industry-forum {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files /index.html =404;
  }

  location = /cases/industry-forum/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files /index.html =404;
  }

  location = /cases/chipsea-computex-2026 {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files /index.html =404;
  }

  location = /cases/chipsea-computex-2026/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files /index.html =404;
  }

  # Reserve the material namespace as a deny-only route. Do not add original PPT/PDF/DOCX
  # source files here; authorised material stays in the controlled project storage service.
  location = /case-materials {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    return 404;
  }

  location ^~ /case-materials/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    return 404;
  }

  # Compressed on-site photo derivatives are embedded in the noindex case page only.
  # They are not source files, download attachments, or image-search assets.
  location ^~ /case-media/ {
    add_header X-Robots-Tag "noindex, noimageindex, noarchive, nosnippet" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri =404;
  }

  # A fresh document must always point to the current hashed JavaScript bundle after a
  # container replacement. Hashed assets can remain aggressively cached; only the SPA
  # document and fallback routes are revalidated on every navigation.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
